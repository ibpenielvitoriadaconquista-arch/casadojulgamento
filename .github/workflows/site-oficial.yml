name: Verificar projeto oficial
on:
  pull_request:
  push:
    branches: [main, migracao/site-oficial-20261017]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site-oficial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/site-oficial/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
